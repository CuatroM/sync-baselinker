name: Promociones - leer la planilla (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Leer «Promos - Decidir»
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          set -o pipefail
          python promos_leer.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp promos_planilla.json /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          cp /tmp/out/* .
          git add -A
          git commit -qm "Lectura de Promos - Decidir"
          git push -qf origin diagnostico

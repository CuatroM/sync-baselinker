name: Mercado Libre - Revisar y arreglar portadas de publicaciones puntuales

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      items:
        description: "Números de publicación separados por espacio (con o sin MLA), o la palabra esperando = todas las que esperan corrección"
        required: true
      dry_run:
        description: "1 = solo revisar (guarda la portada actual y la corregida), 0 = cambiar la portada y reactivar"
        default: "1"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa > /dev/null
      - run: pip install -r requirements.txt numpy scipy opencv-contrib-python-headless==4.10.0.84
      - name: Revisar items
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ITEMS: ${{ github.event.inputs.items }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_revisar_items.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Revisar items"
          git push -qf origin diagnostico

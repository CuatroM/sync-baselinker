name: Mercado Libre - Portada que incumple tamaño
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      modo:
        description: "moderacion = solo las que ML marcó 'La portada incumple tamaño' (se regeneran más grandes y se reactivan); vacío = todas las pausadas chicas"
        default: "moderacion"
      dry_run:
        description: "1 = solo revisar (guarda ejemplos antes/después), 0 = corregir"
        default: "1"
concurrency:
  group: mercadolibre-portada
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  portada:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt numpy opencv-contrib-python-headless==4.10.0.84
      - name: Revisar y corregir portadas
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          set -o pipefail
          python ml_portada.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "portada"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/portada.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan portada
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Portadas"
          git push -qf origin portada

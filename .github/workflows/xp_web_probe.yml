name: EXTRAPOWER - Probar web (solo lectura)
on:
  workflow_dispatch:
    inputs:
      codigos:
        description: "Códigos separados por coma"
        default: "B420,NA4144,J720,C010,NA5156,WS370040,A032,NA8201"
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probar
        env:
          CODIGOS: ${{ github.event.inputs.codigos }}
        run: python xp_web_probe.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Prueba web EXTRAPOWER"
          git push -qf origin diagnostico

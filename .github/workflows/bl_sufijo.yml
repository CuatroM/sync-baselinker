name: BaseLinker - Agregar sufijo al SKU

on:
  workflow_dispatch:
    inputs:
      inventario:
        description: "ID del inventario de BaseLinker"
        default: "65209"
      sufijo:
        description: "Sufijo a agregar"
        default: "#EXTRAPOWER"
      dry_run:
        description: "1 = solo informar, 0 = renombrar"
        default: "1"

concurrency:
  group: baselinker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sufijo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Agregar sufijo
        env:
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          INVENTARIO: ${{ github.event.inputs.inventario }}
          SUFIJO: ${{ github.event.inputs.sufijo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          python bl_sufijo.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Sufijo SKU BaseLinker"
          git push -qf origin diagnostico

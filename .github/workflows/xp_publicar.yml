name: Mercado Libre - Crear publicaciones EXTRAPOWER

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      skus:
        description: "Códigos separados por coma (sin #EXTRAPOWER), o @xp_lote1 para un lote preparado"
        default: "@xp_prueba"
      margen:
        description: "Margen % sobre el precio de BaseLinker (lista + IVA). 400 = x5"
        default: "400"
      stock:
        description: "Stock a publicar"
        default: "1"
      dry_run:
        description: "1 = validar sin crear nada, 0 = crear (quedan pausadas)"
        default: "1"
      tipo:
        description: "gold_special = Clásica, gold_pro = Premium"
        default: "gold_special"
      extra:
        description: "Datos extra: SKU|Atributo=Valor;SKU|Atributo=Valor (o *|Atributo=Valor para todos)"
        default: ""
      envio:
        description: "me2 = Mercado Envíos, not_specified = acordar con el vendedor"
        default: "me2"
      precio_minimo:
        description: "Precio a usar cuando la categoría exige un mínimo (ML pide $1000)"
        default: "100000"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          SKUS: ${{ github.event.inputs.skus }}
          MARGEN: ${{ github.event.inputs.margen }}
          STOCK: ${{ github.event.inputs.stock }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TIPO: ${{ github.event.inputs.tipo }}
          ENVIO: ${{ github.event.inputs.envio }}
          EXTRA: ${{ github.event.inputs.extra }}
          PRECIO_MINIMO: ${{ github.event.inputs.precio_minimo }}
          PROVEEDOR_USER: ${{ secrets.PROVEEDOR_USER }}
          PROVEEDOR_PASS: ${{ secrets.PROVEEDOR_PASS }}
          PROVEEDOR: "EXTRAPOWER"
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
        run: |
          set -o pipefail
          python ml_publicar.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Resultado publicación Mercado Libre"
          git push -qf origin diagnostico

name: Mercado Libre - Sugerir categorías (solo lectura)

on:
  workflow_dispatch:
    inputs:
      lista:
        description: "Archivo con [{sku, titulo}]"
        default: "datos/republicar.json"

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sugerir
        run: |
          set -o pipefail
          LISTA="${{ github.event.inputs.lista }}" python ml_sugerir_categorias.py 2>&1 | tee resultado.txt
      - name: Sugerir
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Sugerencias de categorías"
          git push -qf origin diagnostico

name: J&A - Probar listado de la tienda (solo lectura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python jya_probe.py > /tmp/probe.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan descargas && git rm -rfq . && cp /tmp/probe.txt resultado.txt && git add resultado.txt && git commit -qm probe && git push -qf origin descargas

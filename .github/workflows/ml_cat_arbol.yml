name: Mercado Libre - Buscar categorías en el árbol (solo lectura)

on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "Expresión a buscar en el nombre de la categoría"
        default: "neum|atornill|balance|aceite|cincel|aguja|motor|sierra|lubric|filtro|pulid|lustr"
      raices:
        description: "Categorías raíz, separadas por coma"
        default: "Herramientas,Industrias y Oficinas"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Buscar
        env:
          BUSCAR: ${{ github.event.inputs.buscar }}
          RAICES: ${{ github.event.inputs.raices }}
        run: |
          set -o pipefail
          python ml_cat_arbol.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Categorías encontradas"
          git push -qf origin diagnostico

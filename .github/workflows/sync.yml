name: Sincronizar precio y stock con BaseLinker

on:
  schedule:
    # Cada 4 horas (GitHub usa hora UTC; 03:00 UTC = 00:00 Argentina).
    # Corre a las 00, 04, 08, 12, 16 y 20 hs de Argentina.
    - cron: "7 3,7,11,15,19,23 * * *"
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano
    inputs:
      dry_run:
        description: "Simular sin escribir en BaseLinker (1 = sí, 0 = no)"
        default: "0"
      max_sufijos:
        description: "Máximo de SKU a los que agregar #FEMA en esta corrida (vacío = lo de config)"
        default: ""

concurrency:
  group: sync-baselinker    # nunca corren dos sincronizaciones a la vez
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sincronizar
        env:
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          PROVEEDOR_USER: ${{ secrets.PROVEEDOR_USER }}
          PROVEEDOR_PASS: ${{ secrets.PROVEEDOR_PASS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MAX_SUFIJOS: ${{ github.event.inputs.max_sufijos }}
        run: |
          set -o pipefail
          python sync.py 2>&1 | tee /tmp/sync.log

      - name: Publicar reportes en la rama "reportes"
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git fetch -q origin reportes:reportes 2>/dev/null; then
            git worktree add -q /tmp/pub reportes
          else
            git worktree add -q --orphan -b reportes /tmp/pub
          fi
          cd /tmp/pub
          rm -rf reportes
          cp "$GITHUB_WORKSPACE"/reportes/*.csv . 2>/dev/null || true
          cp /tmp/sync.log ultima-ejecucion.log 2>/dev/null || true
          # conserva solo los reportes de los últimos ~5 días (30 ejecuciones)
          for pref in cambios sin-vincular advertencias; do
            ls ${pref}-*.csv 2>/dev/null | sort | head -n -30 | xargs -r rm -f
          done
          git add -A
          git commit -qm "Reportes ejecución ${{ github.run_number }}" || exit 0
          git push -q origin reportes

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ github.run_number }}
          path: reportes/
          retention-days: 30

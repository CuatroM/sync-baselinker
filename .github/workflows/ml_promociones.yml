name: Mercado Libre - Promociones a la planilla (solo lectura en ML)

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      margen_min:
        description: "SÍ conviene si precio con promo ≥ costo BaseLinker × este valor"
        default: "1.8"
      margen_revisar:
        description: "REVISAR si precio con promo ≥ costo × este valor (debajo: NO)"
        default: "1.4"
      solo:
        description: "Opcional: IDs de promoción separados por coma (vacío = todas)"
        default: ""

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Leer promociones
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          MARGEN_MIN: ${{ github.event.inputs.margen_min }}
          MARGEN_REVISAR: ${{ github.event.inputs.margen_revisar }}
          SOLO: ${{ github.event.inputs.solo }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_promociones.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Promociones"
          git push -qf origin diagnostico

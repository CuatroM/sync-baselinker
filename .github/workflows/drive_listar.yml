name: Drive - Listar carpeta (solo lectura)

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Link de la carpeta de Drive (pública)"
        required: true
      profundidad:
        description: "Niveles de subcarpetas a recorrer"
        default: "3"

permissions:
  contents: write

jobs:
  listar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Listar
        env:
          CARPETA: ${{ github.event.inputs.carpeta }}
          PROFUNDIDAD: ${{ github.event.inputs.profundidad }}
        run: |
          set -o pipefail
          python drive_listar.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Listado carpeta Drive"
          git push -qf origin diagnostico

name: TORREON - Sincronizar stock y precio con la web

on:
  schedule:
    # Cada 4 horas (21:07, 01:07, 05:07, 09:07, 13:07 y 17:07 de Argentina)
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin escribir en BaseLinker (1 = sí, 0 = no)"
        default: "1"

concurrency:
  group: sync-baselinker    # nunca a la vez que la de FEMA (límite de la API de BaseLinker)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sincronizar TORREON
        env:
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          set -o pipefail
          python torreon_sync.py 2>&1 | tee /tmp/torreon.log
      - name: Publicar reportes en la rama "reportes"
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git fetch -q origin reportes:reportes 2>/dev/null; then
            git worktree add -q /tmp/pub reportes
          else
            git worktree add -q --orphan -b reportes /tmp/pub
          fi
          cd /tmp/pub
          cp "$GITHUB_WORKSPACE"/reportes/torreon-*.csv . 2>/dev/null || true
          cp /tmp/torreon.log torreon-ultima-ejecucion.log 2>/dev/null || true
          for pref in torreon-cambios torreon-sin-vincular torreon-advertencias; do
            ls ${pref}-*.csv 2>/dev/null | sort | head -n -30 | xargs -r rm -f
          done
          git add -A
          git commit -qm "Reportes TORREON ${{ github.run_number }}" || exit 0
          git push -q origin reportes

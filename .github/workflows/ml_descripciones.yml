name: Mercado Libre - Actualizar descripciones

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      skus:
        description: "SKU (sin #FEMA), separados por coma: se actualizan todas sus publicaciones"
        default: "69351050,69351065,69351110,69503874,69504110,69350850,69503222,69503750,69310440,69310640,69310650,69310350,69310557,69310450,69310555,69310370,69310480"
      dry_run:
        description: "1 = simular, 0 = aplicar"
        default: "0"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  descripciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Actualizar
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          SKUS: ${{ github.event.inputs.skus }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_descripciones.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Resultado descripciones Mercado Libre"
          git push -qf origin diagnostico

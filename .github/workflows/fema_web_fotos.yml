name: Mercado Libre - Fotos desde la web de FEMA

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (no hace falta en modo revisar)"
        default: ""
      dry_run:
        description: "1 = solo revisar, 0 = reemplazar las fotos"
        default: "1"
      lista:
        description: "Lista de trabajo (archivo en datos/, sin .json)"
        default: "revisar_estado"
      desde:
        description: "Saltear las primeras N de la lista (para continuar)"
        default: "0"
      limite:
        description: "Procesar como máximo N (0 = todas)"
        default: "0"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reemplazar
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DESDE: ${{ github.event.inputs.desde }}
          LISTA: ${{ github.event.inputs.lista }}
          LIMITE: ${{ github.event.inputs.limite }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python fema_web_fotos.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Resultado fotos web FEMA"
          git push -qf origin diagnostico

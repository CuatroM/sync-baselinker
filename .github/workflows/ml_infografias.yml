name: Mercado Libre - Subir imágenes informativas (fotos 2 y 3)

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      dry_run:
        description: "1 = simulación (no cambia nada), 0 = subir las imágenes"
        default: "1"
      limite:
        description: "Cantidad de publicaciones a procesar (vacío = todas)"
        default: "10"
        required: false
      desde:
        description: "Empezar desde la publicación número (0 = desde el principio)"
        default: "0"
        required: false
      lista:
        description: "Lista de trabajo"
        default: "datos/infografias_t1.json"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bajar las imágenes de la rama "infografias"
        run: |
          git fetch -q origin infografias:refs/remotes/origin/infografias
          mkdir -p infografias
          git archive refs/remotes/origin/infografias | tar -x -C infografias
      - name: Subir imágenes
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMITE: ${{ github.event.inputs.limite }}
          DESDE: ${{ github.event.inputs.desde }}
          LISTA: ${{ github.event.inputs.lista }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_infografias.py 2>&1 | tee resultado.txt
      - name: Guardar el registro de imágenes subidas
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -f datos/infografias_subidas.json ] && [ -n "$(git status --porcelain datos/infografias_subidas.json)" ]; then
            git add datos/infografias_subidas.json
            git commit -qm "Registro de imágenes informativas subidas"
            git pull -q --rebase && git push -q
          fi
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          rm -rf infografias
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Imágenes informativas"
          git push -qf origin diagnostico

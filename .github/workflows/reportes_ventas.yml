name: Reportes VENTAS (Mercado Libre + Mercado Pago)

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Período: vacío = mes en curso · 2026-10 = un mes · 2026-10-01:2026-10-15 = rango · ayer · hoy · completo (12 meses)"
        required: false
        default: ""
      codigo:
        description: "Código TG-... de Mercado Libre (vacío = solo Mercado Pago)"
        required: false
        default: ""

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Armar reporte
        env:
          PERIODO: ${{ github.event.inputs.periodo }}
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python reporte_ventas.py 2>&1 | tee resultado.txt
      # Copia cifrada para que Claude la pueda entregar por el chat. Se cifra con la clave
      # pública del repo (la privada solo la tiene la sesión de Claude), así que en la rama
      # pública "reportes-cifrados" nadie más puede leerla.
      - name: Guardar copia cifrada
        if: always()
        run: |
          f=$(ls salida/reporte_ventas_*.xlsx 2>/dev/null | head -1)
          [ -n "$f" ] && [ -f reportes_clave_publica.pem ] || exit 0
          mkdir -p /tmp/cif
          K=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$K -in "$f" -out /tmp/cif/reporte.xlsx.enc
          printf %s "$K" | openssl pkeyutl -encrypt -pubin -inkey reportes_clave_publica.pem \
            -pkeyopt rsa_padding_mode:oaep -out /tmp/cif/clave.enc
          basename "$f" > /tmp/cif/nombre.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan reportes-cifrados
          git rm -rfq .
          cp /tmp/cif/* .
          git add reporte.xlsx.enc clave.enc nombre.txt
          git commit -qm "Reporte cifrado"
          git push -qf origin reportes-cifrados
      # El Excel se entrega como artefacto (no se sube a ninguna rama) y se borra a los 5 días.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ventas
          path: |
            salida/reporte_ventas_*.xlsx
            resultado.txt
          retention-days: 5

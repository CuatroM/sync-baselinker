name: Mercado Libre - Sacar imágenes informativas repetidas

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      dry_run:
        description: "1 = simulación (no cambia nada), 0 = sacar las repetidas"
        default: "1"
      items:
        description: "Números de publicación separados por espacio, o la palabra todas (= todas las del registro)"
        required: true

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt numpy
      - name: Bajar las imágenes de la rama "infografias"
        run: |
          git fetch -q origin infografias:refs/remotes/origin/infografias
          mkdir -p infografias
          git archive refs/remotes/origin/infografias | tar -x -C infografias
      - name: Revisar repetidas
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ITEMS: ${{ github.event.inputs.items }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_infografias_duplicadas.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          rm -rf infografias
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Imágenes informativas repetidas"
          git push -qf origin diagnostico

name: Mercado Libre - Aplicar fichas técnicas y descripciones

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      dry_run:
        description: "1 = solo simular (no cambia nada), 0 = aplicar"
        default: "1"
      skus:
        description: "Solo estos SKU, separados por coma (vacío = todos)"
        default: ""
      limite:
        description: "Máximo de publicaciones (vacío = todas)"
        default: ""
      atributos:
        description: "1 = actualizar atributos de la ficha técnica"
        default: "1"
      descripcion:
        description: "1 = reemplazar la descripción"
        default: "1"

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SKUS: ${{ github.event.inputs.skus }}
          LIMITE: ${{ github.event.inputs.limite }}
          ATRIBUTOS: ${{ github.event.inputs.atributos }}
          DESCRIPCION: ${{ github.event.inputs.descripcion }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_aplicar_fichas.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Resultado fichas Mercado Libre"
          git push -qf origin diagnostico

name: Mercado Libre - Precio mayorista y envíos a acordar

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código TG-... (o la dirección completa) de una autorización recién hecha"
        required: true
      que:
        description: "ambos | mayorista | envios"
        default: "ambos"
      dry_run:
        description: "1 = simulación (no cambia nada), 0 = aplicar"
        default: "1"
      limite:
        description: "Cantidad de publicaciones para probar (vacío = todas)"
        default: ""
        required: false

concurrency:
  group: mercadolibre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Precio mayorista y envíos
        env:
          ML_CODIGO: ${{ github.event.inputs.codigo }}
          QUE: ${{ github.event.inputs.que }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMITE: ${{ github.event.inputs.limite }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python ml_mayorista_envios.py 2>&1 | tee resultado.txt
      - name: Guardar resultado en la rama "diagnostico"
        if: always()
        run: |
          mkdir -p /tmp/out && cp resultado.txt /tmp/out/diagnostico.txt && cp salida/* /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan diagnostico
          git rm -rfq .
          rm -rf salida
          cp /tmp/out/* .
          git add -A
          git commit -qm "Precio mayorista y envíos"
          git push -qf origin diagnostico
